<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support Tickets | Capitaxio Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-embed.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f6fc;color:#202943;padding:26px}
h1{font-size:24px;margin-bottom:8px}.sub{color:#858ba1;font-size:13px;margin-bottom:18px}
.panel{background:#fff;border-radius:13px;padding:20px;box-shadow:0 4px 20px #1b28500a}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select{padding:11px 13px;border:1px solid #e0e4ef;border-radius:8px;outline:none;font-size:13px}.tools input{flex:1;min-width:180px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th{background:#f7f8fc;color:#777f98;font-size:12px;text-align:left;padding:13px 11px}
td{padding:13px 11px;border-bottom:1px solid #eef0f6;font-size:13px;overflow-wrap:anywhere}
.pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:bold}
.open{background:#fff2d7;color:#9b6a08}.answered{background:#e0f8ed;color:#168354}.closed{background:#edf0f6;color:#6f7890}
button{border:none;border-radius:8px;padding:9px 13px;font-size:12px;font-weight:bold;cursor:pointer}
.b1{background:#eae6ff;color:#6249cf}.b2{background:#7058dc;color:#fff}.b3{background:#edf0f6;color:#59637a}.b4{background:#ffe5e8;color:#c6374b}
button:disabled{opacity:.6;cursor:not-allowed}
.empty{text-align:center;color:#858ba1;padding:28px}
.modal{display:none;position:fixed;inset:0;background:#10152dbb;z-index:50;justify-content:center;align-items:center;padding:16px}
.box{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:620px;max-height:92vh;overflow-y:auto}
.box h2{font-size:18px;margin-bottom:6px}.meta{color:#858ba1;font-size:12px;margin-bottom:14px}
.thread{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.m{padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;max-width:88%}
.m.user{background:#f0f2f8;align-self:flex-start}.m.admin{background:#e9e4ff;align-self:flex-end}
.m small{display:block;color:#858ba1;font-size:10px;margin-top:5px}
textarea{width:100%;min-height:80px;padding:11px;border:1px solid #e0e4ef;border-radius:8px;outline:none;font-size:14px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:flex-end}
.msg{display:none;margin-bottom:14px;padding:11px 14px;border-radius:9px;font-size:13px}
.msg.show{display:block}.msg.err{background:#ffe5e8;color:#c6374b}.msg.ok{background:#e0f8ed;color:#168354}
</style>
</head>
<body style="visibility:hidden">
<h1>Support Tickets</h1>
<p class="sub">Users ke masail aur un ke jawab.</p>
<div class="msg" id="msg"></div>
<div class="panel">
  <div class="tools">
    <input type="search" id="search" placeholder="Search..." autocomplete="off">
    <select id="statusFilter" autocomplete="off">
      <option value="">Sab</option><option value="open">Open</option><option value="answered">Answered</option><option value="closed">Closed</option>
    </select>
    <button class="b1" id="refresh" type="button">↻ Refresh</button>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>User</th><th>Subject</th><th>Status</th><th>Updated</th><th>Action</th></tr></thead>
    <tbody id="body"></tbody>
  </table></div>
</div>

<div class="modal" id="modal"><div class="box">
  <h2 id="mTitle"></h2><div class="meta" id="mMeta"></div>
  <div class="thread" id="thread"></div>
  <textarea id="reply" maxlength="2000" placeholder="Jawab likhein..."></textarea>
  <div class="row">
    <button class="b3" id="closeTicket" type="button">Ticket band karein</button>
    <button class="b2" id="sendReply" type="button">Jawab bhejein</button>
    <button class="b3" id="closeModal" type="button">Close</button>
  </div>
</div></div>

<script>
const db = window.supabase.createClient("https://zwffgoenruzcctkyptjg.supabase.co", "sb_publishable_6qL9pLwCjdfLAt6ftaSSTQ_SvWff4Ar");
let rows = [], current = null;

function el(t, c, x) { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; }
function msg(t, ok) { const m = document.getElementById("msg"); m.textContent = t || ""; m.className = "msg" + (t ? " show " + (ok ? "ok" : "err") : ""); }

function render() {
  const term = document.getElementById("search").value.trim().toLowerCase();
  const st = document.getElementById("statusFilter").value;
  const body = document.getElementById("body"); body.textContent = "";
  const list = rows.filter(function (r) {
    return (!st || r.status === st) && [r.full_name, r.email, r.subject].join(" ").toLowerCase().indexOf(term) !== -1;
  });
  if (!list.length) { const tr = el("tr"); const td = el("td", "empty", "Koi ticket nahi."); td.colSpan = 5; tr.appendChild(td); body.appendChild(tr); return; }
  list.forEach(function (r) {
    const tr = el("tr");
    const u = el("td"); u.appendChild(el("div", "", r.full_name || "—")); const s = el("small", "", r.email || ""); s.style.color = "#858ba1"; u.appendChild(s);
    tr.appendChild(u);
    tr.appendChild(el("td", "", r.subject));
    const st2 = el("td"); st2.appendChild(el("span", "pill " + r.status, r.status)); tr.appendChild(st2);
    tr.appendChild(el("td", "", r.updated_at ? new Date(r.updated_at).toLocaleString() : ""));
    const a = el("td"); const b = el("button", "b1", "Kholein"); b.type = "button"; b.addEventListener("click", function () { openTicket(r); }); a.appendChild(b); tr.appendChild(a);
    body.appendChild(tr);
  });
}

async function load() {
  const r = await db.from("support_tickets_report").select("*").order("updated_at", { ascending: false }).limit(500);
  if (r.error) { msg("Tickets load nahi huin: " + r.error.message, false); return; }
  rows = r.data || []; render();
}

async function loadThread() {
  const th = document.getElementById("thread"); th.textContent = "";
  const r = await db.from("ticket_messages").select("sender, message, created_at").eq("ticket_id", current.id).order("created_at", { ascending: true });
  if (r.error) { th.appendChild(el("div", "empty", "Paigham load nahi hue.")); return; }
  (r.data || []).forEach(function (m) {
    const d = el("div", "m " + m.sender, m.message);
    d.appendChild(el("small", "", (m.sender === "admin" ? "Admin" : "User") + " · " + new Date(m.created_at).toLocaleString()));
    th.appendChild(d);
  });
}

async function openTicket(r) {
  current = r;
  document.getElementById("mTitle").textContent = r.subject;
  document.getElementById("mMeta").textContent = (r.full_name || "") + " · " + (r.email || "") + " · " + r.status;
  document.getElementById("reply").value = "";
  document.getElementById("closeTicket").textContent = r.status === "closed" ? "Dobara kholein" : "Ticket band karein";
  document.getElementById("modal").style.display = "flex";
  await loadThread();
}

document.getElementById("sendReply").addEventListener("click", async function () {
  const text = document.getElementById("reply").value.trim();
  if (!text) { alert("Pehle jawab likhein."); return; }
  const btn = this; btn.disabled = true;
  const ins = await db.from("ticket_messages").insert({ ticket_id: current.id, sender: "admin", message: text }).select("id");
  if (ins.error || !ins.data || !ins.data.length) { btn.disabled = false; alert("Jawab nahi gaya: " + (ins.error ? ins.error.message : "admin permission check karein")); return; }
  await db.from("support_tickets").update({ status: "answered", updated_at: new Date().toISOString() }).eq("id", current.id);
  btn.disabled = false;
  document.getElementById("reply").value = "";
  msg("Jawab bhej diya gaya.", true);
  await loadThread(); await load();
});

document.getElementById("closeTicket").addEventListener("click", async function () {
  const next = current.status === "closed" ? "open" : "closed";
  const r = await db.from("support_tickets").update({ status: next, updated_at: new Date().toISOString() }).eq("id", current.id).select("id");
  if (r.error || !r.data || !r.data.length) { alert("Nahi hua: " + (r.error ? r.error.message : "admin permission check karein")); return; }
  document.getElementById("modal").style.display = "none";
  msg("Ticket " + (next === "closed" ? "band" : "dobara khol") + " kar diya.", true);
  load();
});

document.getElementById("closeModal").addEventListener("click", function () { document.getElementById("modal").style.display = "none"; });
document.getElementById("modal").addEventListener("click", function (e) { if (e.target === this) this.style.display = "none"; });
document.getElementById("search").addEventListener("input", render);
document.getElementById("statusFilter").addEventListener("change", render);
document.getElementById("refresh").addEventListener("click", load);

(async function () {
  const s = (await db.auth.getSession()).data;
  if (!s.session) { location.replace("admin-login.html"); return; }
  const a = (await db.from("admins").select("id").eq("user_id", s.session.user.id).eq("is_active", true).maybeSingle()).data;
  if (!a) { await db.auth.signOut(); location.replace("admin-login.html"); return; }
  document.body.style.visibility = "visible";
  load();
})();
</script>
</body>
</html>
