<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capitaxio | Team Rewards</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#081326;color:#f4f7ff;
  font-family:Inter,Arial,sans-serif
}
.topbar{
  background:#102b68;padding:20px 25px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(255,255,255,.1)
}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px}
.logo{
  width:38px;height:38px;border-radius:10px;background:#0870ff;
  display:grid;place-items:center;font-size:22px
}
.admin{font-size:12px;color:#d8e7ff}
.container{padding:30px;max-width:1400px;margin:auto}
.breadcrumb{font-size:12px;color:#8eb6ed;margin-bottom:12px}
h1{font-size:27px;margin:0 0 8px}
.subtitle{font-size:13px;color:#a9bddf;margin-bottom:25px}
.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;
  margin-bottom:22px
}
.card{
  background:linear-gradient(145deg,#142746,#0e1b33);
  border:1px solid rgba(255,255,255,.09);
  border-radius:13px;padding:21px
}
.card-title{font-size:12px;color:#b7c9e5}
.number{font-size:27px;font-weight:800;margin-top:13px}
.panel{
  background:#101e38;border:1px solid rgba(255,255,255,.09);
  border-radius:13px;padding:22px
}
.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:12px;margin-bottom:18px
}
.panel h2{font-size:16px;margin:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
input{
  background:#132544;border:1px solid #29446c;color:white;
  border-radius:8px;padding:11px 13px;outline:none
}
button{
  background:#17bce8;color:white;border:0;padding:11px 16px;
  border-radius:8px;font-weight:700;cursor:pointer
}
button:hover{background:#079dca}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{
  padding:14px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);
  font-size:12px;white-space:nowrap
}
th{color:#8fc8f5;font-weight:700}
td{color:#e0eaff}
.message{
  background:#172a48;padding:15px;border-radius:9px;
  font-size:12px;color:#c8dcf7;line-height:1.7
}
.error{color:#ffb7a8}
.footer{font-size:11px;color:#8299bb;margin-top:18px}
@media(max-width:650px){
  .container{padding:18px 13px}
  .stats{grid-template-columns:1fr}
  .topbar{padding:15px}
  h1{font-size:23px}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">C</div>
    <div>CAPITAXIO ADMIN</div>
  </div>
  <div class="admin">Administrator</div>
</header>

<main class="container">
  <div class="breadcrumb">Admin / Team Rewards</div>
  <h1>Team Rewards</h1>
  <p class="subtitle">Review and manage team reward records.</p>

  <div class="stats">
    <div class="card">
      <div class="card-title">Total Team Reward Records</div>
      <div class="number" id="totalRecords">—</div>
    </div>
    <div class="card">
      <div class="card-title">Database Status</div>
      <div class="number" id="dbStatus" style="font-size:18px">Connecting...</div>
    </div>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>Team Rewards Records</h2>
      <div class="actions">
        <input id="searchInput" type="search" placeholder="Search records..." oninput="filterRows()">
        <button onclick="loadRewards()">Refresh</button>
      </div>
    </div>

    <div id="message" class="message">Connecting to Supabase...</div>

    <div class="table-wrap" id="tableWrap" style="display:none">
      <table>
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <p class="footer">
    Capitaxio Admin Panel · Team Rewards
  </p>
</main>

<script>
const SUPABASE_URL = "https://zwffgoenruzcctkyptjg.supabase.co";
const SUPABASE_KEY = "sb_publishable_6qL9pLwCjdfLAt6ftaSSTQ_SvWff4Ar";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let allRewards = [];

function safeText(value){
  if(value === null || value === undefined) return "—";
  if(typeof value === "object") return JSON.stringify(value);
  return String(value);
}

function showMessage(message, isError=false){
  const box = document.getElementById("message");
  box.textContent = message;
  box.className = isError ? "message error" : "message";
  box.style.display = "block";
}

async function loadRewards(){
  const status = document.getElementById("dbStatus");
  const total = document.getElementById("totalRecords");
  const tableWrap = document.getElementById("tableWrap");

  status.textContent = "Loading...";
  total.textContent = "—";
  tableWrap.style.display = "none";
  showMessage("Loading team rewards from Supabase...");

  try{
    const { data, error } = await supabaseClient
      .from("team_rewards")
      .select("*");

    if(error) throw error;

    allRewards = data || [];
    total.textContent = allRewards.length;
    status.textContent = "Connected";

    if(allRewards.length === 0){
      showMessage("Supabase connected, lekin team_rewards table mein abhi koi record nahi hai.");
      return;
    }

    renderTable(allRewards);
    document.getElementById("message").style.display = "none";
    tableWrap.style.display = "block";

  }catch(error){
    status.textContent = "Error";
    total.textContent = "—";
    showMessage(
      "Supabase error: " + error.message +
      " | Check karein ke team_rewards table maujood hai aur SELECT permission/RLS policy allow karti hai.",
      true
    );
    console.error("Team rewards error:", error);
  }
}

function renderTable(rows){
  const head = document.getElementById("tableHead");
  const body = document.getElementById("tableBody");

  if(!rows.length){
    head.innerHTML = "";
    body.innerHTML = "";
    showMessage("Search se koi matching record nahi mila.");
    document.getElementById("tableWrap").style.display = "none";
    return;
  }

  const columns = Object.keys(rows[0]);

  head.innerHTML = "<tr>" +
    columns.map(col => "<th>" + safeText(col.replaceAll("_"," ").toUpperCase()) + "</th>").join("") +
    "</tr>";

  body.innerHTML = rows.map(row =>
    "<tr>" + columns.map(col =>
      "<td>" + safeText(row[col]) + "</td>"
    ).join("") + "</tr>"
  ).join("");

  document.getElementById("tableWrap").style.display = "block";
}

function filterRows(){
  const query = document.getElementById("searchInput").value.toLowerCase();

  const filtered = allRewards.filter(row =>
    Object.values(row).some(value =>
      safeText(value).toLowerCase().includes(query)
    )
  );

  if(filtered.length){
    document.getElementById("message").style.display = "none";
    renderTable(filtered);
  }else{
    renderTable([]);
  }
}

loadRewards();
</script>
</body>
</html>
