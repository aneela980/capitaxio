<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extensions | Capitaxio Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-embed.js"></script>
</head>
<body style="visibility:hidden">
<div id="app"></div>
<script>
window.PAGE = {
 "description": "Website ke extra features ki list (on/off).",
 "table": "extensions",
 "orderBy": "created_at",
 "columns": [
  {
   "key": "name",
   "label": "Name",
   "type": "text"
  },
  {
   "key": "description",
   "label": "Description",
   "type": "text"
  },
  {
   "key": "is_active",
   "label": "Active",
   "type": "bool"
  },
  {
   "key": "created_at",
   "label": "Added",
   "type": "date"
  }
 ],
 "form": [
  {
   "key": "name",
   "label": "Naam",
   "type": "text",
   "required": true,
   "maxlength": 80
  },
  {
   "key": "description",
   "label": "Wazahat",
   "type": "textarea",
   "maxlength": 400
  },
  {
   "key": "is_active",
   "label": "Active",
   "type": "checkbox",
   "default": true
  }
 ],
 "canAdd": true,
 "canEdit": true,
 "canDelete": true,
 "toggleKey": "is_active",
 "searchKeys": [
  "name",
  "description"
 ],
 "addLabel": "+ New Extension",
 "title": "Extensions"
};
</script>
<script src="admin-crud.js"></script>
</body>
</html>
