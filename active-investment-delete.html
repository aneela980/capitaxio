<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capitaxio | Active Investment Delete</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#081326;color:#eef4ff;padding:25px}
.container{max-width:1200px;margin:auto}
.header{background:#102b68;padding:24px;border-radius:14px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.header h1{font-size:24px;margin-bottom:7px}
.header p{color:#b9c9ed;font-size:13px}
button{background:#17bce8;color:#041426;border:0;padding:11px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
.card,.panel{background:#13213a;border:1px solid #263b5e;padding:20px;border-radius:12px}
.card{margin-bottom:20px}
.card p{color:#a9bad7;font-size:13px;margin-bottom:10px}
.card h2{font-size:26px;color:#22c5ee}
.panel-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
input{background:#081326;border:1px solid #344b70;color:white;padding:12px;border-radius:8px;width:260px;max-width:100%}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:14px;text-align:left;border-bottom:1px solid #293b58;font-size:13px}
th{color:#62d8f4;background:#192b49}
td{color:#dce7fa}
#message{padding:12px;color:#ffb6b6;font-size:13px}
.empty{text-align:center;padding:25px;color:#a9bad7}
@media(max-width:600px){body{padding:12px}.header h1{font-size:20px}.panel{padding:12px}}
</style>
</head>
<body>
<div class="container">

<div class="header">
 <div>
  <h1>Active Investment Delete</h1>
  <p>View deleted active investment history</p>
 </div>
 <button onclick="loadHistory()">Refresh History</button>
</div>

<div class="card">
 <p>Total Deleted Investment Records</p>
 <h2 id="total">—</h2>
</div>

<div class="panel">
 <div class="panel-top">
  <h3>Investment Deletion History</h3>
  <input id="search" type="search" placeholder="Search records..." oninput="renderHistory()">
 </div>

 <div id="message">Loading history...</div>
 <div class="table-wrap">
  <table>
   <thead id="head"></thead>
   <tbody id="rows"></tbody>
  </table>
 </div>
</div>

</div>

<script>
const SUPABASE_URL="https://zwffgoenruzcctkyptjg.supabase.co";
const SUPABASE_KEY="sb_publishable_6qL9pLwCjdfLAt6ftaSSTQ_SvWff4Ar";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let records=[];
let columns=[];

async function loadHistory(){
 const message=document.getElementById("message");
 message.textContent="Loading history...";

 const {data,error}=await db
  .from("active_investment_deletions")
  .select("*");

 if(error){
  message.textContent="Database error: "+error.message;
  document.getElementById("head").innerHTML="";
  document.getElementById("rows").innerHTML="";
  return;
 }

 records=data||[];
 columns=records.length?Object.keys(records[0]):[];

 document.getElementById("total").textContent=records.length;
 message.textContent=records.length?"":"No deletion records found.";

 renderHistory();
}

function renderHistory(){
 const search=document.getElementById("search").value.toLowerCase();

 const filtered=records.filter(record=>
  JSON.stringify(record).toLowerCase().includes(search)
 );

 const head=document.getElementById("head");
 const rows=document.getElementById("rows");

 if(!columns.length){
  head.innerHTML="";
  rows.innerHTML='<tr><td class="empty">No records available.</td></tr>';
  return;
 }

 head.innerHTML="<tr>"+columns.map(col=>
  `<th>${safe(col.replaceAll("_"," "))}</th>`
 ).join("")+"</tr>";

 if(!filtered.length){
  rows.innerHTML=`<tr><td colspan="${columns.length}" class="empty">No matching records found.</td></tr>`;
  return;
 }

 rows.innerHTML=filtered.map(record=>
  "<tr>"+columns.map(col=>
   `<td>${safe(record[col])}</td>`
  ).join("")+"</tr>"
 ).join("");
}

function safe(value){
 return String(value??"—").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[c]));
}

loadHistory();
</script>
</body>
</html>
