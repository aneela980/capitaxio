<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Packages | Capitaxio Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-embed.js"></script>
</head>
<body style="visibility:hidden">
<div id="app"></div>
<script>
window.PAGE = {
 "title": "Salary Packages",
 "description": "Packages ki list: naam, raqam aur muddat.",
 "table": "salary_packages",
 "orderBy": "created_at",
 "columns": [
  {
   "key": "name",
   "label": "Name",
   "type": "text"
  },
  {
   "key": "description",
   "label": "Description",
   "type": "text"
  },
  {
   "key": "amount",
   "label": "Amount",
   "type": "money"
  },
  {
   "key": "duration_days",
   "label": "Days",
   "type": "text"
  },
  {
   "key": "is_active",
   "label": "Active",
   "type": "bool"
  },
  {
   "key": "created_at",
   "label": "Date",
   "type": "date"
  }
 ],
 "form": [
  {
   "key": "name",
   "label": "Package Name",
   "type": "text",
   "required": true,
   "maxlength": 100
  },
  {
   "key": "description",
   "label": "Description",
   "type": "textarea",
   "maxlength": 500
  },
  {
   "key": "amount",
   "label": "Amount (Rs.)",
   "type": "number",
   "required": true,
   "min": 0
  },
  {
   "key": "duration_days",
   "label": "Duration (days)",
   "type": "number",
   "required": true,
   "min": 1
  },
  {
   "key": "is_active",
   "label": "Active",
   "type": "checkbox",
   "default": true
  }
 ],
 "canAdd": true,
 "canEdit": true,
 "canDelete": true,
 "toggleKey": "is_active",
 "searchKeys": [
  "name",
  "description"
 ],
 "addLabel": "+ New Package"
};
</script>
<script src="admin-crud.js"></script>
</body>
</html>
