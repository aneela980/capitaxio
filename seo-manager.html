<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Manager | Capitaxio Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-embed.js"></script>
</head>
<body style="visibility:hidden">
<div id="app"></div>
<script>
window.PAGE = {
 "table": "site_settings",
 "mode": "single",
 "idKey": "id",
 "idValue": 1,
 "title": "SEO Manager",
 "description": "Website ka title aur description (search engines ke liye).",
 "form": [
  {
   "key": "seo_title",
   "label": "SEO Title",
   "type": "text",
   "maxlength": 70
  },
  {
   "key": "seo_description",
   "label": "SEO Description",
   "type": "textarea",
   "maxlength": 200
  },
  {
   "key": "seo_keywords",
   "label": "Keywords",
   "type": "text",
   "maxlength": 200,
   "help": "Comma se alag karein"
  }
 ]
};
</script>
<script src="admin-crud.js"></script>
</body>
</html>
