<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Report | Capitaxio Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin-embed.js"></script>
</head>
<body style="visibility:hidden">
<div id="app"></div>
<script>
window.PAGE = {

 "orderBy": "kind",
 "ascending": true,
 "columns": [
  {
   "key": "kind",
   "label": "Type",
   "type": "text"
  },
  {
   "key": "status",
   "label": "Status",
   "type": "badge"
  },
  {
   "key": "total_count",
   "label": "Requests",
   "type": "text"
  },
  {
   "key": "total_amount",
   "label": "Total Amount",
   "type": "money"
  }
 ],
 "title": "Finance Report"
};
</script>
<script src="admin-crud.js"></script>

</html>
