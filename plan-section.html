<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capitaxio | Plan Section</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#081326;color:#eef4ff;padding:25px}
.container{max-width:1200px;margin:auto}
.header{background:#102b68;padding:24px;border-radius:14px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.header h1{font-size:25px;margin-bottom:7px}
.header p{color:#b9c9ed;font-size:13px}
button{background:#17bce8;color:#041426;border:0;padding:11px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.card{background:#13213a;border:1px solid #263b5e;padding:20px;border-radius:12px}
.card p{color:#a9bad7;font-size:13px;margin-bottom:10px}
.card h2{font-size:26px;color:#22c5ee}
.panel{background:#13213a;border:1px solid #263b5e;padding:20px;border-radius:12px}
.panel-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
input{background:#081326;border:1px solid #344b70;color:white;padding:12px;border-radius:8px;width:260px;max-width:100%}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:750px}
th,td{padding:14px;text-align:left;border-bottom:1px solid #293b58;font-size:13px}
th{color:#62d8f4;background:#192b49}
td{color:#dce7fa}
.status{padding:6px 10px;border-radius:20px;font-size:11px;background:#244b43;color:#8df0bd}
.inactive{background:#55323a;color:#ffabb5}
#message{padding:12px;color:#ffb6b6;font-size:13px}
.empty{text-align:center;padding:25px;color:#a9bad7}
@media(max-width:600px){body{padding:12px}.header h1{font-size:21px}.panel{padding:12px}}
</style>
</head>
<body>
<div class="container">

<div class="header">
 <div>
  <h1>Plan Section</h1>
  <p>Manage and view your Capitaxio investment plans</p>
 </div>
 <button onclick="loadPlans()">Refresh Plans</button>
</div>

<div class="stats">
 <div class="card">
  <p>Total Plans</p>
  <h2 id="totalPlans">—</h2>
 </div>
 <div class="card">
  <p>Active Plans</p>
  <h2 id="activePlans">—</h2>
 </div>
 <div class="card">
  <p>Inactive Plans</p>
  <h2 id="inactivePlans">—</h2>
 </div>
</div>

<div class="panel">
 <div class="panel-top">
  <h3>All Investment Plans</h3>
  <input type="search" id="search" placeholder="Search plans..." oninput="renderPlans()">
 </div>

 <div id="message">Loading plans...</div>
 <div class="table-wrap">
  <table>
   <thead>
    <tr>
     <th>ID</th>
     <th>Plan Name</th>
     <th>Amount</th>
     <th>Duration</th>
     <th>Description</th>
     <th>Status</th>
    </tr>
   </thead>
   <tbody id="planRows"></tbody>
  </table>
 </div>
</div>

</div>

<script>
const SUPABASE_URL = "https://zwffgoenruzcctkyptjg.supabase.co";
const SUPABASE_KEY = "sb_publishable_6qL9pLwCjdfLAt6ftaSSTQ_SvWff4Ar";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let plans = [];

async function loadPlans(){
 const message = document.getElementById("message");
 message.textContent = "Loading plans...";

 const {data,error} = await db
  .from("plans")
  .select("id,name,description,amount,duration,is_active,sort_order,created_at")
  .order("sort_order",{ascending:true});

 if(error){
  message.textContent = "Database error: " + error.message;
  return;
 }

 plans = data || [];

 document.getElementById("totalPlans").textContent = plans.length;
 document.getElementById("activePlans").textContent =
  plans.filter(p=>p.is_active===true).length;
 document.getElementById("inactivePlans").textContent =
  plans.filter(p=>p.is_active===false).length;

 message.textContent = plans.length ? "" : "No plans found.";
 renderPlans();
}

function renderPlans(){
 const search = document.getElementById("search").value.toLowerCase();
 const filtered = plans.filter(p =>
  String(p.name || "").toLowerCase().includes(search) ||
  String(p.description || "").toLowerCase().includes(search)
 );

 const rows = document.getElementById("planRows");

 if(!filtered.length){
  rows.innerHTML = '<tr><td colspan="6" class="empty">No matching plans found.</td></tr>';
  return;
 }

 rows.innerHTML = filtered.map(p => `
  <tr>
   <td>${escapeHTML(p.id)}</td>
   <td>${escapeHTML(p.name || "—")}</td>
   <td>${escapeHTML(p.amount ?? "—")}</td>
   <td>${escapeHTML(p.duration ?? "—")}</td>
   <td>${escapeHTML(p.description || "—")}</td>
   <td>
    <span class="status ${p.is_active ? "" : "inactive"}">
     ${p.is_active ? "Active" : "Inactive"}
    </span>
   </td>
  </tr>
 `).join("");
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g, char => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[char]));
}

loadPlans();
</script>
</body>
</html>
